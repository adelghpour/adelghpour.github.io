<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Moonlight Chess</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; overflow: hidden; background: #000;">
    <canvas id="unity-canvas" width=324 height=432 tabindex="-1" style="position: fixed; inset: 0; width: 100%; height: 100%; background: url('Build/MoonlightChess.jpg') center / cover"></canvas>
    <script src="../unity-gz.js"></script>
    <script src="Build/MoonlightChess.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      prepareUnityGz({
        arguments: [],
        dataUrl: "Build/MoonlightChess.data.gz",
        frameworkUrl: "Build/MoonlightChess.framework.js.gz",
        codeUrl: "Build/MoonlightChess.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DancingDivStudio",
        productName: "Moonlight Chess",
        productVersion: "1.2.1",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((config) => createUnityInstance(document.querySelector("#unity-canvas"), config)).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
